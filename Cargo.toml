[package]
name = "breakpoint"
version = "0.1.0"
edition = "2021"

[lib]
name = "breakpoint"
path = "src/lib.rs"

[[bin]]
name = "brk"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "0.8"
futures = "0.3"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
# 直连 provider 用 reqwest（rustls-only）；0.13 的 rustls feature 名即 "rustls"。
# 不引入 aisdk：其传递依赖会拉入 OpenSSL 且无 TLS feature 开关，违反 rustls-only 硬约束。
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
# ripgrep 内核 crate：gitignore 感知遍历(ignore) + 正则搜索(grep-*)；纯 Rust，无 OpenSSL。
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
