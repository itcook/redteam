[package]
name = "redteam"
version = "0.1.0"
edition = "2021"

[lib]
name = "redteam"
path = "src/lib.rs"

[[bin]]
name = "redteam"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
schemars = "0.8"
futures = "0.3"
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
# 直连 provider 用 reqwest（rustls-only）；0.13 的 rustls feature 名即 "rustls"。
# 不引入 aisdk：其传递依赖会拉入 OpenSSL 且无 TLS feature 开关，违反 rustls-only 硬约束。
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
# ripgrep 内核 crate：gitignore 感知遍历(ignore) + 正则搜索(grep-*)；纯 Rust，无 OpenSSL。
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
# 逐行 def 正则匹配（卷宗改动符号提取）。regex 是新增直接依赖——grep-regex 只拉 regex-automata/regex-syntax，不含 regex 本体。
regex = "1"
libc = "0.2"
# 台账/评审史持久层（.redteam/proj.db）。bundled：sqlite 编译进二进制,零系统依赖。
# turso embedded 对比后因 beta 定案不用、不留期权(见 .doc/design/2026-07-03 台账机器化)。
rusqlite = { version = "0.32", features = ["bundled"] }
# SCIP 语义索引解析（M15-S2-b）。scip 0.9 bundled protobuf 绑定、免 protoc；protobuf 是 Index::parse_from_bytes 所需直接依赖。
scip = "0.9"
protobuf = "3"
# 运行期 SCIP 索引临时文件（即弃、零仓库足迹）——从 dev-dependencies 升为正式依赖。
tempfile = "3"

[dev-dependencies]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
